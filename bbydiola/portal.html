<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👶 Baby Diola • Live Portal</title>
<style>
:root{
  --pink:#f45b9c;
  --blue:#4fa9e8;
  --navy:#17375f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#000}

.stage{position:fixed;inset:0;display:flex}

/* Looping video fills all remaining space, zero wasted margin */
.video-area{flex:1 1 auto;position:relative;min-width:0;background:#000;height:100vh}
.video-area video{width:100%;height:100%;object-fit:cover;display:block}
.video-veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.05),rgba(0,0,0,.3) 82%,rgba(0,0,0,.55));pointer-events:none}

.brand{position:absolute;top:2.2vh;left:2.2vw;z-index:3;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.5)}
.brand .kicker{letter-spacing:.3vw;text-transform:uppercase;font-weight:800;font-size:clamp(11px,1.1vw,15px);opacity:.85}
.brand h1{font-family:"Brush Script MT","Segoe Script",cursive;font-size:clamp(30px,3.6vw,56px);margin-top:.3vh}

/* Sidebar — fixed % of screen, full height, zero outer margin, tight internal spacing for max content on a TV */
.sidebar{flex:0 0 26vw;min-width:300px;max-width:460px;height:100vh;background:linear-gradient(160deg,#fff6fa,#f4fbff);display:flex;flex-direction:column;padding:1.8vh 1.4vw;box-shadow:-20px 0 50px rgba(0,0,0,.25);z-index:2;overflow:hidden}
.sidebar h2{color:var(--navy);font-size:clamp(17px,1.6vw,24px);text-align:center;line-height:1.1}
.sidebar .subtitle{text-align:center;color:#7187a0;font-size:clamp(10px,.9vw,13px);margin:.2vh 0 1.4vh}

.tally{display:grid;grid-template-columns:1fr 1fr;gap:.8vw;margin-bottom:1.4vh}
.tally-box{border-radius:16px;padding:1.2vh .5vw;text-align:center;font-weight:900;transition:transform .3s}
.tally-box b{font-size:clamp(24px,2.8vw,42px);display:block;line-height:1}
.tally-box .lbl{font-size:clamp(10px,.9vw,13px)}
.tb-boy{background:#e2f5ff;color:#287fc7}
.tb-girl{background:#fff0f7;color:#e94e91}
.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.14)}100%{transform:scale(1)}}

.bar-wrap{height:1vh;min-height:9px;border-radius:999px;background:#eef2f6;overflow:hidden;margin-bottom:1.6vh;display:flex;flex-shrink:0}
.bar-boy{background:linear-gradient(90deg,#4fa9e8,#8fd4f7);height:100%;transition:width .6s ease}
.bar-girl{background:linear-gradient(90deg,#f45b9c,#ffb7d3);height:100%;transition:width .6s ease}

.feed-label{font-weight:800;color:var(--navy);font-size:clamp(11px,1vw,14px);text-transform:uppercase;letter-spacing:.4px;margin-bottom:1vh;flex-shrink:0}

/* Auto-scrolling viewport — no scrollbar, content moves itself */
.feed-viewport{flex:1;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 6%, black 94%, transparent 100%);mask-image:linear-gradient(to bottom, transparent 0%, black 6%, black 94%, transparent 100%)}
.feed-track{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;gap:.9vh;transition:transform 1s ease}

.feed-item{background:#fff;border-radius:14px;padding:1.1vh 1vw;box-shadow:0 4px 14px rgba(23,55,95,.08);flex-shrink:0}
.feed-item .fi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.3vh;gap:8px}
.feed-item .fi-name{font-weight:800;color:var(--navy);font-size:clamp(12px,1.1vw,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed-item .fi-badge{font-size:clamp(9px,.85vw,11px);font-weight:900;padding:.25vh .7vw;border-radius:999px;flex-shrink:0}
.fi-badge.BOY{background:#e2f5ff;color:#287fc7}
.fi-badge.GIRL{background:#fff0f7;color:#e94e91}
.feed-item .fi-msg{font-size:clamp(11px,1vw,13.5px);color:#3a5674;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed-empty{text-align:center;color:#a5b6c6;font-size:clamp(11px,1vw,13px);padding:3vh 1vw}

.live-tag{font-size:clamp(9px,.85vw,11px);font-weight:800;color:#e0316f;text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-top:1.2vh;flex-shrink:0}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e0316f;margin-right:5px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}

@media(max-width:900px){
  .stage{flex-direction:column}
  .video-area{flex:1.2 1 auto;height:auto}
  .sidebar{flex:0 0 auto;width:100%;max-width:none;height:44vh}
}
</style>
</head>
<body>

<div class="stage">
  <div class="video-area">
    <video id="loopVideo" autoplay muted loop playsinline preload="auto">
      <source src="baby-video.mp4" type="video/mp4">
    </video>
    <div class="video-veil"></div>
    <div class="brand">
      <div class="kicker">Baby Diola • Live</div>
      <h1></h1>
    </div>
  </div>

  <div class="sidebar">
    <h2>Live Predictions</h2>
    <p class="subtitle">Updating in real time</p>

    <div class="tally">
      <div class="tally-box tb-boy"><span class="lbl">💙 BOY</span><b id="boyCount">0</b></div>
      <div class="tally-box tb-girl"><span class="lbl">💗 GIRL</span><b id="girlCount">0</b></div>
    </div>

    <div class="bar-wrap">
      <div class="bar-boy" id="barBoy" style="width:50%"></div>
      <div class="bar-girl" id="barGirl" style="width:50%"></div>
    </div>

    <div class="feed-label">🎉 Recent Guest Messages</div>
    <div class="feed-viewport">
      <div class="feed-track" id="feedTrack">
        <div class="feed-empty">Waiting for the first prediction...</div>
      </div>
    </div>

    <div class="live-tag"><span class="live-dot"></span>LIVE</div>
  </div>
</div>

<script>
// Venue-screen only — meant to run on a TV/monitor at the event, not shared publicly.
// Uses the same admin-key endpoint as the dashboard so it can show guest messages too.
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwOd78s2g8OQ6tq5MI8rqTcebdAjgtxcCIczdS1MEYQkuZlv4jXblUsuMWx0i6jVXE1/exec";
const PORTAL_KEY = "diola2026secret"; // must match ADMIN_KEY in Code.gs

let lastBoy = 0, lastGirl = 0, lastSeenCount = 0;
let allSubs = [];
let scrollIndex = 0;
let itemHeightPx = 0;

async function pollResults(){
  try{
    const res = await fetch(GOOGLE_SCRIPT_URL + "?key=" + encodeURIComponent(PORTAL_KEY) + "&t=" + Date.now());
    const data = await res.json();
    if(!data.submissions) return;

    const subs = data.submissions; // newest-first from Code.gs
    const boy = subs.filter(s=>s.prediction==="BOY").length;
    const girl = subs.filter(s=>s.prediction==="GIRL").length;

    updateTally(boy, girl);
    updateFeedData(subs);
  }catch(e){
    console.warn("Portal fetch error", e);
  }
}

function updateTally(boy, girl){
  const boyEl = document.getElementById("boyCount");
  const girlEl = document.getElementById("girlCount");

  if(boy !== lastBoy){ boyEl.textContent = boy; bump(boyEl); lastBoy = boy; }
  if(girl !== lastGirl){ girlEl.textContent = girl; bump(girlEl); lastGirl = girl; }

  const total = boy + girl;
  const boyPct = total ? (boy/total*100) : 50;
  const girlPct = total ? (girl/total*100) : 50;
  document.getElementById("barBoy").style.width = boyPct + "%";
  document.getElementById("barGirl").style.width = girlPct + "%";
}

function bump(el){
  el.classList.remove("bump");
  void el.offsetWidth;
  el.classList.add("bump");
}

function updateFeedData(subs){
  if(subs.length === lastSeenCount) return; // nothing new, leave the track alone
  lastSeenCount = subs.length;
  allSubs = subs.slice(0, 30); // cap so the loop doesn't get huge
  scrollIndex = 0;
  renderTrack();
}

function renderTrack(){
  const track = document.getElementById("feedTrack");
  track.style.transition = "none";
  track.style.transform = "translateY(0)";
  track.innerHTML = "";

  if(allSubs.length === 0){
    track.innerHTML = "<div class='feed-empty'>Waiting for the first prediction...</div>";
    return;
  }

  // Duplicate the list once so the auto-scroll can loop seamlessly
  [...allSubs, ...allSubs].forEach(s=>{
    const item = document.createElement("div");
    item.className = "feed-item";
    item.innerHTML = `
      <div class="fi-top">
        <span class="fi-name">${escapeHtml(s.name || "Guest")}</span>
        <span class="fi-badge ${s.prediction}">${s.prediction === "BOY" ? "💙 Boy" : "💗 Girl"}</span>
      </div>
      <div class="fi-msg">${escapeHtml(s.message || "")}</div>
    `;
    track.appendChild(item);
  });

  requestAnimationFrame(()=>{
    const firstItem = track.querySelector(".feed-item");
    itemHeightPx = firstItem ? firstItem.getBoundingClientRect().height +
      parseFloat(getComputedStyle(track).gap || 0) : 0;
  });
}

// Auto-advance the feed by one card every few seconds — no manual scrolling needed
function autoScrollTick(){
  if(allSubs.length <= 1 || !itemHeightPx) return;
  const track = document.getElementById("feedTrack");

  scrollIndex++;
  track.style.transition = "transform 1s ease";
  track.style.transform = `translateY(-${scrollIndex * itemHeightPx}px)`;

  // Once we've scrolled past the first full set, snap back to start invisibly
  if(scrollIndex >= allSubs.length){
    setTimeout(()=>{
      track.style.transition = "none";
      track.style.transform = "translateY(0)";
      scrollIndex = 0;
    }, 1050);
  }
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

pollResults();
setInterval(pollResults, 5000);   // pull fresh data every 5s
setInterval(autoScrollTick, 4000); // advance the feed by one card every 4s
</script>
</body>
</html>
