<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --envelope-color: #4a5d4e; /* Elegant Sage Green */
            --envelope-inside: #3d4f41;
            --card-color: #ffffff;
            --text-color: #333333;
            --gold: #d4af37;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        /* Envelope Container */
        .envelope-wrapper {
            position: relative;
            width: 450px;
            height: 300px;
            background-color: var(--envelope-inside);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            perspective: 1000px;
        }

        /* Front Flaps & Body */
        .envelope-wrapper::before {
            content: '';
            position: absolute;
            z-index: 3;
            border-left: 225px solid transparent;
            border-right: 225px solid transparent;
            border-bottom: 150px solid var(--envelope-color);
            bottom: 0;
            width: 0;
            height: 0;
        }

        .envelope-wrapper::after {
            content: '';
            position: absolute;
            z-index: 3;
            border-top: 150px solid transparent;
            border-bottom: 150px solid transparent;
            border-left: 225px solid rgba(255, 255, 255, 0.05);
            bottom: 0;
            left: 0;
        }

        /* Top Lid */
        .lid {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 225px solid transparent;
            border-right: 225px solid transparent;
            border-top: 150px solid var(--envelope-color);
            transform-origin: top;
            transition: transform 0.6s ease-in-out;
            z-index: 4;
        }

        /* Wax Seal */
        .wax-seal {
            position: absolute;
            top: 135px;
            left: 205px;
            width: 40px;
            height: 40px;
            background-color: var(--gold);
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: opacity 0.3s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        /* Invitation Card */
        .wedding-card {
            position: absolute;
            bottom: 10px;
            left: 25px;
            width: 400px;
            height: 260px;
            background-color: var(--card-color);
            z-index: 2;
            transition: transform 0.6s ease-in-out 0.4s;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            border: 2px solid var(--gold);
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
        }

        .wedding-card h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: var(--text-color);
            font-weight: normal;
        }

        .wedding-card p {
            font-size: 14px;
            margin: 5px 0;
            color: #666;
            line-height: 1.6;
        }

        .wedding-card .date {
            font-weight: bold;
            color: var(--envelope-color);
            margin-top: 15px;
        }

        /* --- Animation States (Triggered by Active Class) --- */
        
        /* 1. Open the Lid */
        .envelope-wrapper.open .lid {
            transform: rotateX(180deg);
            z-index: 1;
        }

        /* 2. Hide the Wax Seal */
        .envelope-wrapper.open .wax-seal {
            opacity: 0;
            pointer-events: none;
        }

        /* 3. Slide the Card Up out of the envelope */
        .envelope-wrapper.open .wedding-card {
            transform: translateY(-180px);
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- Click anywhere on the envelope to open -->
    <div class="envelope-wrapper" onclick="toggleEnvelope()">
        <div class="lid"></div>
        <div class="wax-seal">W</div>
        
        <div class="wedding-card">
            <h1>Save the Date</h1>
            <p>Together with their families</p>
            <p style="font-size: 18px; color: var(--gold); margin: 10px 0;"><strong>Emma & Alexander</strong></p>
            <p>invite you to celebrate their wedding</p>
            <p class="date">OCTOBER 24, 2026</p>
            <p style="font-size: 12px; letter-spacing: 1px;">THE GRAND CHATEAU</p>
        </div>
    </div>

    <script>
        function toggleEnvelope() {
            const envelope = document.querySelector('.envelope-wrapper');
            envelope.classList.toggle('open');
        }
    </script>

</body>
</html>
